server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The invoice builder reads the live Homo catalog from the web app. Keeping
  # this proxy on the CRM origin prevents CORS failures in the deployed app.
  location /site-api/ {
    proxy_pass http://web-frontend:3000/api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Catalog crops and Saveria product photos are returned by the main site.
  location /api/uploads/ {
    proxy_pass http://web-frontend:3000/api/uploads/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /products/ {
    proxy_pass http://web-frontend:3000/products/;
  }
}
