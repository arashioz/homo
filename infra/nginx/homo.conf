# Homo production reverse proxy
# Copy to /etc/nginx/sites-available/homo.conf and symlink into sites-enabled.
# Replace example domains, then:
#   sudo certbot --nginx -d homo.example.com -d crm.example.com -d api.homo.example.com
# App processes should bind to 127.0.0.1 only (Next :3000, Nest :4000, CRM :8100).

upstream homo_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream homo_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

upstream homo_crm {
  server 127.0.0.1:8100;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name homo.example.com crm.example.com api.homo.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name homo.example.com;

  ssl_certificate     /etc/letsencrypt/live/homo.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/homo.example.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 30m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location ^~ /admin {
    return 308 https://crm.example.com/;
  }

  location ^~ /api/admin {
    default_type application/json;
    return 410 '{"error":"admin_closed"}';
  }

  location / {
    proxy_pass http://homo_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name crm.example.com;

  ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 40m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_pass http://homo_crm;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /site-api/ {
    proxy_pass http://homo_web/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.homo.example.com;

  ssl_certificate     /etc/letsencrypt/live/api.homo.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.homo.example.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 40m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_pass http://homo_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}
