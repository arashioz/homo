# From the repo root:
#   docker compose up -d
# Site :3000 · CRM :8100 · API :4000
name: homo

services:
  mongo:
    image: mongo:8.0
    container_name: homo-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - homo_mongo_data:/data/db
    ports:
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  mongo-init:
    image: mongo:8.0
    container_name: homo-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        if mongosh --host mongo --quiet --eval 'rs.status().ok' >/dev/null 2>&1; then
          echo "Replica set rs0 is already initialized."
        else
          mongosh --host mongo --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]})'
        fi
        until mongosh --host mongo --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do
          sleep 1
        done

  crm-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: homo-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: v1
      MONGODB_URI: mongodb://mongo:27017/homo?replicaSet=rs0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8100,http://127.0.0.1:3000,http://127.0.0.1:8100}
      JWT_SECRET: ${JWT_SECRET:-homo-local-development-secret-change-before-production}
      CRM_ADMIN_USERNAME: ${CRM_ADMIN_USERNAME:-admin}
      CRM_ADMIN_PASSWORD: ${CRM_ADMIN_PASSWORD:-admin123}
      CRM_ADMIN_SYNC_PASSWORD: "1"
      SITE_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      SITE_DATA_DIR: /site-data
      SITE_PUBLIC_DIR: /site-public
      SITE_ROOT: /site-root
    volumes:
      - ./data:/site-data
      - ./public:/site-public
      - ./scripts:/site-root/scripts:ro
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${CRM_API_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  crm-seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: homo-seed
    restart: "no"
    environment:
      MONGODB_URI: mongodb://mongo:27017/homo?replicaSet=rs0
      CRM_ADMIN_USERNAME: ${CRM_ADMIN_USERNAME:-admin}
      CRM_ADMIN_PASSWORD: ${CRM_ADMIN_PASSWORD:-admin123}
      SITE_DATA_DIR: /site-data
    volumes:
      - ./data:/site-data:ro
      - ./data:/app/data:ro
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    command: ["node", "backend/dist/database/seed.js"]

  web-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
        NEXT_PUBLIC_CRM_URL: ${CRM_PUBLIC_URL:-http://localhost:8100}
    container_name: homo-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      NEXT_PUBLIC_CRM_URL: ${CRM_PUBLIC_URL:-http://localhost:8100}
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:-http://localhost:8100}
    volumes:
      - ./data:/app/data
      - ./public/products:/app/public/products
      - ./public/projects:/app/public/projects
      - ./uploads:/app/uploads
    ports:
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  crm-frontend:
    build:
      context: ./apps/crm-frontend
      args:
        VITE_CRM_API_URL: ${CRM_PUBLIC_API_URL:-http://localhost:4000/v1}
    container_name: homo-crm
    restart: unless-stopped
    depends_on:
      crm-backend:
        condition: service_healthy
      web-frontend:
        condition: service_started
    ports:
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${CRM_FRONTEND_PORT:-8100}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  homo_mongo_data:
